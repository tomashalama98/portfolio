name: E2E testy e-shopu

on:
  push:
    paths:
      - "eshop-pw/**"
      - ".github/workflows/eshop-tests.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1" # každé pondělí v 05:17 UTC

jobs:
  e2e:
    runs-on: ubuntu-24.04 # Playwright 1.49 oficiálně podporuje 24.04; ubuntu-latest je už novější
    timeout-minutes: 20
    defaults:
      run:
        working-directory: eshop-pw
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: eshop-pw/package-lock.json

      - name: Instalace závislostí
        run: npm ci

      - name: Instalace prohlížeče Chromium
        run: npx playwright install --with-deps chromium

      - name: Spuštění testů
        run: npx playwright test
        env:
          CI: "true"

      - name: Nahrání HTML reportu
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: eshop-pw/playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Nahrání trace a screenshotů
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-trace
          path: eshop-pw/test-results/
          retention-days: 14
          if-no-files-found: ignore
